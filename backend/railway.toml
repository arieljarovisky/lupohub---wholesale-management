# Railway: en el servicio → Settings → Root Directory = "backend" (obligatorio).
# Si el build corre desde la raíz del repo, sube frontend + backend y puede agotar disco.

[build]
# npm ci lo ejecuta Railpack antes; prune en build reduce node_modules post-tsc.
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start"
# AFIP/ARCA: no bajar AFIP_ROUTE_TIMEOUT_MS por debajo de 90000 si ARCA está lento (502/CORS falsos en el navegador).
# Opcional: AFIP_MAX_WAIT_MS=95000, AFIP_ROUTE_TIMEOUT_MS=110000, AFIP_RETRY_MAX=4

